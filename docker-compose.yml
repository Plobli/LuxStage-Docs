services:
  luxstage-docs:
    build: .
    container_name: luxstage-docs
    restart: unless-stopped
    ports:
      - "3000:5173"
    volumes:
      - ./docs:/app/docs
      - node_modules:/app/node_modules
    networks:
      - web
    environment:
      - VITE_HOST=0.0.0.0

volumes:
  node_modules:

networks:
  web:
    external: true
    name: caddy
